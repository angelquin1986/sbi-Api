<h1 mat-dialog-title>Remove all files</h1>
<mat-dialog-content>
  <p>Are you sure you want to remove all the files?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Ok</button>
</mat-dialog-actions>
