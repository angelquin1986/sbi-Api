<h2 mat-dialog-title>Remove File</h2>
<mat-dialog-content>
  <h3>Are you sure you want to remove the file?</h3>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Ok</button>
</mat-dialog-actions>
