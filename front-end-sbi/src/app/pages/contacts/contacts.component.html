<div class="basic-container">
  <app-header-contactos-publico></app-header-contactos-publico>
  <br>
  <!--div *ngIf="usuario === null ">
    <button mat-stroked-button color="primary" (click)="ingresarSesion()">Login </button>
  </div>

  <div *ngIf="usuario !== null ">
    <app-header-dashboard></app-header-dashboard>
    Usuario:  {{ usuario}}
    <button mat-stroked-button color="primary" (click)="cerrarSesion()">Logout</button>
  </div-->

  <mat-card style="width: 100%;">
    <mat-form-field appearance="outline" class="example-full-width" style="text-align: left" color="accent"
      floatLabel="always">
      <!-- <mat-label style="text-align: center;">Filter</mat-label> -->
      <input matInput (keyup)="aplicarFiltro($event.target.value)" placeholder="Filter">
      <!-- <input matInput name="nombreContacto" [ngModel]="this.datosDashboard['nombreContacto']"> -->
    </mat-form-field>
  </mat-card>
  <br>
  <!-- <mat-form-field>
    <input matInput (keyup)="aplicarFiltro($event.target.value)" placeholder="Filter">
  </mat-form-field> -->

  <div class="contiene mat-elevation-z8">
    <table style="width: 100%" mat-table [dataSource]="dataSource" matSort>

      <!-- nombre Column -->
      <ng-container matColumnDef="nombre" sticky>
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let row"> {{row.nombre}} </td>
      </ng-container>

      <!-- cargo Column -->
      <ng-container matColumnDef="cargo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Position </th>
        <td mat-cell *matCellDef="let row"> {{row.cargo | titlecase}} </td>
      </ng-container>

      <!-- mail Column -->
      <ng-container matColumnDef="mail">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> E-mail </th>
        <td mat-cell *matCellDef="let row"> {{row.mail}} </td>
      </ng-container>

      <!-- ext_Royal_GPS Column -->
      <ng-container matColumnDef="ext_Royal_GPS">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Ext Royal GPS </th>
        <td mat-cell *matCellDef="let row"> {{row.ext_Royal_GPS}} </td>
      </ng-container>

      <!-- ext_Ip Column -->
      <ng-container matColumnDef="ext_Ip">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Ext Ip </th>
        <td mat-cell *matCellDef="let row"> {{row.ext_Ip}} </td>
      </ng-container>

      <!-- cel_ofi Column -->

      <ng-container matColumnDef="cel_ofi">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Mobile Number </th>
        <td mat-cell *matCellDef="let row"> {{row.cel_ofi}} </td>
      </ng-container>

      <!-- ext Column -->
      <ng-container matColumnDef="ext" stickyEnd>
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Ext </th>
        <td mat-cell *matCellDef="let row"> {{row.ext}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; "></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;">
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 25, 50, 75, 100]"></mat-paginator>
  </div>

</div>

<div *ngIf="usuario === null ">
  <app-footer-contactos-publicos></app-footer-contactos-publicos>
</div>

<div *ngIf="usuario !== null ">
  <app-footer-dashboard></app-footer-dashboard>
</div>
