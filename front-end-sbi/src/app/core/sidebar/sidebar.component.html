<div class="logo">
    <a href="{{serverUrl}}" class="simple-text">
        <div class="logo-img">
            <img src="./assets/images/{{logoCompany}}" />
        </div>
        <br>
        <strong>{{nameCompany}}</strong>
    </a>
</div>
<div class="sidebar-wrapper">
    <ul class="nav">
        <li routerLinkActive="active" *ngFor="let menuItem of menuItems; let i = index"
            class="{{menuItem.class}} nav-item">
            <a class="nav-link" [routerLink]="[menuItem.path]" (click)="activar(menuItem.title)">
                <i class="material-icons">{{menuItem.icon}}</i>
                <p>{{menuItem.title}}</p>
            </a>
        </li>
    </ul>
</div>
